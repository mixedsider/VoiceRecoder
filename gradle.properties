android.useAndroidX=true

# Release packaging includes large native libraries, so keep enough heap for APK
# compression/signing while limiting parallel workers to avoid memory spikes.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.workers.max=2
